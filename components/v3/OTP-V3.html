<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTP - Orbit Verify</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

  :root {
    --bg-a: #0b1550;
    --bg-b: #2f4fd6;
    --card-bg: linear-gradient(160deg, #14205e 0%, #0b1246 100%);
    --text-main: #f4f7ff;
    --text-dim: #8b98d9;
    --accent: #6f8dff;
    --accent-2: #cfe0ff;
    --accent-glow: rgba(111, 141, 255, 0.4);
    --success: #34e5c8;
    --success-glow: rgba(52, 229, 200, 0.35);
    --error: #ff5c7a;
    --error-glow: rgba(255, 92, 122, 0.32);
    --box-bg: #1a276b;
    --box-border: #33429c;
    --radius-card: 20px;
    --radius-slot: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 8vh;
    background:
      linear-gradient(135deg, #0a1247 0%, var(--bg-b) 48%, #16215f 100%);
    font-family: 'Inter', sans-serif;
    color: var(--text-main);
    overflow: hidden;
    position: relative;
  }

  /* diagonal light streak + soft glow, echoes the Aura Studio background reference */
  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .ambient .streak {
    position: absolute;
    top: -20%; left: 55%;
    width: 220px; height: 140%;
    background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.55) 45%, rgba(207,224,255,0.25) 65%, transparent 100%);
    transform: rotate(18deg);
    filter: blur(18px);
    opacity: 0.5;
    animation: streakDrift 9s ease-in-out infinite;
  }
  @keyframes streakDrift { 0%,100% { transform: rotate(18deg) translateX(0); } 50% { transform: rotate(18deg) translateX(-24px); } }
  .ambient span {
    position: absolute;
    width: 480px; height: 480px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.22;
  }
  .ambient span.a { background: var(--accent); top: -140px; left: -160px; animation: drift1 14s ease-in-out infinite; }
  .ambient span.b { background: #ffffff; bottom: -180px; right: -140px; opacity: 0.1; animation: drift2 16s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px, 40px); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px, -30px); } }

  .card {
    width: 100%;
    max-width: 340px;
    background: var(--card-bg);
    border-radius: var(--radius-card);
    padding: 28px 22px 34px;
    position: relative;
    z-index: 1;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
    border: 1px solid var(--box-border);
    text-align: center;
    opacity: 0;
    transform: translateY(60px) scale(0.96);
    transition: opacity 0.8s ease-out, transform 1s cubic-bezier(0.2,0.8,0.2,1);
  }
  .card.visible { opacity: 1; transform: translateY(0) scale(1); }

  .handle {
    width: 36px; height: 4px;
    background: var(--box-border);
    border-radius: 2px;
    margin: 0 auto 22px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 7px;
    transition: color 0.4s ease;
  }
  h1.success { color: var(--success); }
  h1.error { color: var(--error); }

  .subtitle {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.55;
    margin-bottom: 26px;
  }
  .subtitle b { color: var(--text-main); font-weight: 600; }

  .hidden-input {
    position: absolute; width: 1px; height: 1px; opacity: 0;
    top: 0; left: -1000px; pointer-events: none;
  }

  .field {
    position: relative;
    height: 120px;
    margin-bottom: 24px;
    cursor: text;
  }

  .slot {
    position: absolute;
    left: 50%; top: 50%;
    width: 54px; height: 60px;
    margin-left: -27px; margin-top: -30px;
    display: flex; align-items: center; justify-content: center;
    background: var(--box-bg);
    border: 1.5px solid var(--box-border);
    border-radius: var(--radius-slot);
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--text-main);
    z-index: 2;
    opacity: 0;
    transition: transform 0.6s cubic-bezier(0.25,1,0.3,1),
                border-color 0.4s, box-shadow 0.4s,
                opacity 0.5s, color 0.4s;
  }
  .slot.show { opacity: 1; }
  .slot.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
  }
  .slot.error-active {
    border-color: var(--error) !important;
    box-shadow: 0 0 0 4px var(--error-glow) !important;
    color: var(--error);
  }

  /* digit "focus pull" — materializes instead of a flat pop */
  .digit-wrap {
    display: inline-block;
    animation: focusIn 0.38s cubic-bezier(0.2,0.9,0.3,1);
  }
  @keyframes focusIn {
    0%   { opacity: 0; filter: blur(6px); transform: scale(1.5); }
    60%  { opacity: 1; filter: blur(0px); transform: scale(0.96); }
    100% { opacity: 1; filter: blur(0px); transform: scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translate(var(--bx), var(--by)) rotate(var(--br,0deg)) scale(1); }
    20% { transform: translate(calc(var(--bx) - 7px), var(--by)) rotate(-3deg) scale(1); }
    40% { transform: translate(calc(var(--bx) + 7px), var(--by)) rotate(3deg) scale(1); }
    60% { transform: translate(calc(var(--bx) - 5px), var(--by)) rotate(-2deg) scale(1); }
    80% { transform: translate(calc(var(--bx) + 5px), var(--by)) rotate(2deg) scale(1); }
  }
  .slot.shake { animation: shake 0.45s ease-in-out; }

  .slot.flicker { animation: flicker 0.5s steps(2, end) 1; }
  @keyframes flicker { 0%,100% { filter: brightness(1); } 30% { filter: brightness(1.8) saturate(1.4); } 60% { filter: brightness(0.7); } }

  .slot .caret {
    width: 2px; height: 22px;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    animation: caretPulse 1.1s ease-in-out infinite;
    border-radius: 2px;
  }
  @keyframes caretPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.15; } }

  /* success ring — the point the boxes orbit into */
  .success-ring {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(0.4);
    width: 60px; height: 60px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    z-index: 3;
    opacity: 0;
    background: radial-gradient(circle at 35% 30%, rgba(52,229,200,0.18), transparent 70%);
    border: 2px solid var(--success);
    box-shadow: 0 0 0 0 var(--success-glow);
    transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.2,0.9,0.3,1);
  }
  .success-ring.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .success-ring.pulse { animation: ringPulse 1.4s ease-out 2; }
  @keyframes ringPulse {
    0%   { box-shadow: 0 0 0 0 var(--success-glow); }
    70%  { box-shadow: 0 0 0 22px rgba(52,229,200,0); }
    100% { box-shadow: 0 0 0 0 rgba(52,229,200,0); }
  }
  .success-ring svg path {
    fill: none;
    stroke: var(--success);
    stroke-width: 3.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 28;
    stroke-dashoffset: 28;
    transition: stroke-dashoffset 0.55s ease 0.1s;
  }

  #spark-canvas {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 999;
  }

  .footer-action {
    font-size: 13px;
    color: var(--text-dim);
    transition: opacity 0.4s;
  }
  .footer-action span {
    color: var(--accent-2);
    font-weight: 600;
    cursor: pointer;
  }

  .secure-badge {
    position: absolute;
    bottom: 34px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--success);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s, transform 0.5s;
  }
  .secure-badge.show { opacity: 1; transform: translateY(0); }
  .secure-badge svg { width: 15px; height: 15px; }
</style>
</head>
<body>

  <div class="ambient"><div class="streak"></div><span class="a"></span><span class="b"></span></div>

  <canvas id="spark-canvas"></canvas>
  <input type="text" inputmode="numeric" maxlength="4" autocomplete="one-time-code" class="hidden-input" id="hiddenInput">

  <div class="card visible" id="card">
    <div class="handle"></div>
    <h1 id="title">Enter your code</h1>
    <div class="subtitle" id="subtitle">We texted a 4-digit code to your phone.</div>

    <div class="field" id="field">
      <div class="slot show" id="s0"></div>
      <div class="slot show" id="s1"></div>
      <div class="slot show" id="s2"></div>
      <div class="slot show" id="s3"></div>

      <div class="success-ring" id="success-ring">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M5 12l5 5L20 7"/></svg>
      </div>
    </div>

    <div class="footer-action" id="footer-action">
      Didn't get a code? <span id="resend-btn">Resend</span>
    </div>

    <div class="secure-badge" id="secure-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      Verified
    </div>
  </div>

<script>
  // ============================================================
  // API CONFIG — the client plugs their backend in here.
  // Leave apiEndpoint empty and the component works out of the box
  // in local demo mode (checks against localDemoCode).
  // ============================================================
  const OTP_CONFIG = {
    apiEndpoint: '',              // e.g. 'https://your-api.com/verify-otp'
    apiMethod: 'POST',
    extraPayload: {},             // e.g. { phone: '+54911...', sessionId: '...' }
    localDemoCode: '1234'         // used only while apiEndpoint is empty
  };

  // Sends the code to OTP_CONFIG.apiEndpoint and expects back { success: true|false }.
  // Adjust the response parsing line below to match whatever shape the client's API returns.
  async function verifyWithApi(code) {
    try {
      const res = await fetch(OTP_CONFIG.apiEndpoint, {
        method: OTP_CONFIG.apiMethod,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, ...OTP_CONFIG.extraPayload })
      });
      const data = await res.json();
      return !!data.success; // <-- adapt this to the client's real response shape
    } catch (err) {
      console.error('OTP verification request failed:', err);
      return false;
    }
  }

  async function verifyCode(code) {
    if (OTP_CONFIG.apiEndpoint) return verifyWithApi(code);
    return code === OTP_CONFIG.localDemoCode; // local fallback, no backend needed
  }

  const card = document.getElementById('card');
  const hiddenInput = document.getElementById('hiddenInput');
  const slots = [0,1,2,3].map(i => document.getElementById('s'+i));
  const field = document.getElementById('field');
  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');
  const footerAct = document.getElementById('footer-action');
  const resendBtn = document.getElementById('resend-btn');
  const secureBadge = document.getElementById('secure-badge');
  const ring = document.getElementById('success-ring');

  // resting row positions, and per-slot orbit waypoints (arc toward center, slight rotation)
  const ROW_POS = [ {x:-99, y:0, r:0}, {x:-33, y:0, r:0}, {x:33, y:0, r:0}, {x:99, y:0, r:0} ];
  const ORBIT_WAYPOINT = [
    {x:-40, y:-46, r:-14},
    {x:-14, y:-52, r:-6},
    {x:14,  y:-52, r:6},
    {x:40,  y:-46, r:14},
  ];
  const ORBIT_CENTER = {x:0, y:0, r:0};

  let val = '';
  let inError = false;
  let inSuccess = false;

  const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

  function place(el, p, transition) {
    if (transition) el.style.transition = transition;
    el.style.setProperty('--bx', p.x + 'px');
    el.style.setProperty('--by', p.y + 'px');
    el.style.setProperty('--br', (p.r || 0) + 'deg');
    el.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${p.r || 0}deg) scale(1)`;
  }

  // spark burst — directional sparks with slight gravity, instead of a flat radial dot cloud
  const canvas = document.getElementById('spark-canvas');
  const ctx = canvas.getContext('2d');
  let dpr = window.devicePixelRatio || 1;
  let sparks = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function spawnSparks() {
    const rect = ring.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    sparks = [];
    for (let i = 0; i < 46; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2.5;
      sparks.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1.5,
        len: Math.random() * 8 + 4,
        alpha: 1,
        decay: Math.random() * 0.018 + 0.014,
        mint: Math.random() > 0.4
      });
    }
    requestAnimationFrame(renderSparks);
  }

  function renderSparks() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    let active = false;
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.vy += 0.06; // gravity
      p.vx *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= p.decay;
      if (p.alpha > 0) {
        active = true;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 1.4, p.y - p.vy * 1.4);
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = p.mint
          ? `rgba(52, 229, 200, ${Math.max(0, p.alpha) * 0.9})`
          : `rgba(139, 92, 246, ${Math.max(0, p.alpha) * 0.9})`;
        ctx.stroke();
      } else {
        sparks.splice(i, 1);
      }
    }
    if (active) requestAnimationFrame(renderSparks);
  }

  hiddenInput.addEventListener('input', (e) => {
    if (inError || inSuccess) return;
    const oldLen = val.length;
    val = e.target.value.replace(/\D/g, '').substring(0, 4);
    hiddenInput.value = val;
    render(oldLen);
    if (val.length === 4) verify();
  });

  function render(oldLen = 0) {
    slots.forEach((s, i) => {
      if (i < val.length) {
        // only (re)animate the slot that's actually new — untouched slots keep their digit as-is, no re-flash
        if (i >= oldLen || !s.querySelector('.digit-wrap')) {
          s.innerHTML = `<span class="digit-wrap">${val[i]}</span>`;
        }
        s.classList.remove('active');
      } else if (i === val.length) {
        s.innerHTML = '<div class="caret"></div>';
        s.classList.add('active');
      } else {
        s.innerHTML = '';
        s.classList.remove('active');
      }
    });
  }

  function verify() {
    verifyCode(val).then(ok => {
      if (ok) playSuccessSequence();
      else triggerError();
    });
  }

  function triggerError() {
    inError = true;
    title.textContent = 'Wrong code';
    title.className = 'error';
    subtitle.innerHTML = "That code doesn't match. Check your messages and try again.";
    slots.forEach(s => {
      s.classList.remove('active');
      s.classList.add('error-active', 'shake', 'flicker');
    });

    // keyboard stays open on a wrong code — clear the boxes after the shake so they can retype right away
    setTimeout(() => {
      val = '';
      hiddenInput.value = '';
      inError = false;
      slots.forEach(s => {
        s.classList.remove('error-active', 'shake', 'flicker');
        s.innerHTML = '';
      });
      title.textContent = 'Enter your code';
      title.className = '';
      subtitle.innerHTML = 'We texted a 4-digit code to your phone.';
      render();
      hiddenInput.focus();
    }, 900);
  }

  async function playSuccessSequence() {
    inSuccess = true;
    hiddenInput.blur(); // close the mobile keyboard now that the code is confirmed

    // 1 — digits confirm in place
    slots.forEach(s => {
      s.classList.remove('active');
      s.style.borderColor = 'var(--success)';
      s.style.color = 'var(--success)';
      s.style.boxShadow = '0 0 0 4px var(--success-glow)';
    });
    await delay(420);

    title.textContent = 'Verified';
    title.className = 'success';
    subtitle.innerHTML = 'Setting up your session...';
    footerAct.style.opacity = '0';
    await delay(150);

    // 2 — orbit: each slot arcs up and inward on its own waypoint, with rotation
    slots.forEach((s, i) => {
      place(s, ORBIT_WAYPOINT[i], 'transform 0.6s cubic-bezier(0.3,0,0.15,1), border-color 0.4s, box-shadow 0.4s');
    });
    await delay(560);

    // 3 — converge to the exact center, digits dissolve as they merge
    slots.forEach((s, i) => {
      place(s, ORBIT_CENTER, 'transform 0.5s cubic-bezier(0.4,0,0.2,1), opacity 0.4s');
      setTimeout(() => { s.style.color = 'transparent'; }, 260);
    });
    await delay(520);

    // 4 — slots fade, ring blooms with double pulse + checkmark draws + sparks
    slots.forEach(s => { s.style.opacity = '0'; });
    ring.classList.add('show');
    await delay(180);
    ring.classList.add('pulse');
    const checkPath = ring.querySelector('svg path');
    if (checkPath) checkPath.style.strokeDashoffset = '0';
    spawnSparks();
    await delay(300);
    secureBadge.classList.add('show');
  }

  function resetComponent() {
    val = '';
    hiddenInput.value = '';
    inError = false;
    inSuccess = false;

    title.textContent = 'Enter your code';
    title.className = '';
    subtitle.innerHTML = 'We texted a 4-digit code to your phone.';
    footerAct.style.opacity = '1';
    secureBadge.classList.remove('show');

    ring.classList.remove('show', 'pulse');
    const checkPath = ring.querySelector('svg path');
    if (checkPath) checkPath.style.strokeDashoffset = '28';

    slots.forEach((s, i) => {
      s.style.transition = 'none';
      s.style.opacity = '1';
      s.style.color = '';
      s.style.borderColor = '';
      s.style.boxShadow = '';
      s.classList.remove('error-active', 'shake', 'flicker', 'active');
      s.innerHTML = '';
      place(s, ROW_POS[i]);
      s.classList.add('show');
    });

    requestAnimationFrame(() => {
      slots.forEach(s => {
        s.style.transition = 'transform 0.6s cubic-bezier(0.25,1,0.3,1), border-color 0.4s, box-shadow 0.4s, opacity 0.5s, color 0.4s';
      });
      render();
    });
  }

  // tap anywhere on the code field to open the keyboard
  field.addEventListener('click', () => { if (!inSuccess) hiddenInput.focus(); });

  resendBtn.addEventListener('click', () => {
    resetComponent();
    hiddenInput.focus();
  });

  // start with the boxes laid out and the keyboard ready — no play button needed
  slots.forEach((s, i) => place(s, ROW_POS[i]));
  render();
  hiddenInput.focus();
</script>
</body>
</html>
